services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: hapitest
      POSTGRES_USER: hapitest
      POSTGRES_PASSWORD: hapitest
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapitest -d hapitest"]
      interval: 1s
      timeout: 3s
      retries: 30